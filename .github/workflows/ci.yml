name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: support_assistant
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; elif [ -f ../requirements.txt ]; then pip install -r ../requirements.txt; fi

      - name: Build Docker image
        working-directory: support_assistant
        run: docker build -t support-assistant -f DockerFile .

      - name: Lint check (syntax only)
        working-directory: support_assistant
        run: python -m py_compile main.py
